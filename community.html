<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community · adi.vibe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="community">
  <header id="header"></header>

  <main class="wrap">
    <section class="page-head">
      <p class="eyebrow">The vibe hub</p>
      <h1>Hey, you made it 👋</h1>
      <p class="lede">Everything I mention in posts and stories, in one place.</p>
    </section>

    <section>
      <h2>Quick links</h2>
      <div class="links" id="links"></div>
    </section>

    <section>
      <h2>Featured posts</h2>
      <div class="grid three" id="featured"></div>
    </section>

    <section>
      <h2>Favourites</h2>
      <div class="filters" id="fav-filters"></div>
      <div class="grid three" id="favorites"></div>
    </section>

    <section>
      <h2>You ask, I answer</h2>
      <div class="faq" id="faq"></div>
    </section>
  </main>

  <footer id="footer"></footer>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
